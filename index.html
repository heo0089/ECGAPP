<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ECG Live</title>
<style>
  :root {
    --bg: #0b0f0e; --panel: #131917; --line: #1f2a26; --text: #e7efe9; --muted: #8a9a92;
    --trace: #3ef08a; --beat: #ff5a6e; --accent: #3ef08a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, "Apple SD Gothic Neo", "Pretendard", system-ui, sans-serif; }
  body { padding: max(16px, env(safe-area-inset-top)) 16px max(20px, env(safe-area-inset-bottom)); }
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  h1 { font-size: 20px; margin: 0; letter-spacing: -0.02em; }
  .pill { font-size: 13px; padding: 5px 10px; border-radius: 999px; background: var(--panel);
    color: var(--muted); border: 1px solid var(--line); }
  .pill.on { color: var(--accent); border-color: #1f5a3a; }
  .hr { display: flex; align-items: baseline; gap: 10px; margin: 6px 2px 12px; }
  .hr .heart { font-size: 26px; color: var(--beat); transition: transform .12s ease; display: inline-block; }
  .hr .heart.pulse { transform: scale(1.35); }
  .hr .bpm { font-size: 64px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -0.03em; line-height: 1; }
  .hr .unit { color: var(--muted); font-size: 16px; }
  .scope { background: #000; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  canvas { display: block; width: 100%; height: 240px; }
  .stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin: 12px 0 16px; }
  .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
  .stat .k { font-size: 12px; color: var(--muted); }
  .stat .v { font-size: 18px; font-weight: 600; margin-top: 2px; font-variant-numeric: tabular-nums; }
  button { width: 100%; font: inherit; font-size: 17px; font-weight: 600; padding: 15px; border-radius: 14px;
    border: 0; background: var(--accent); color: #04130b; }
  button.secondary { background: var(--panel); color: var(--text); border: 1px solid var(--line); }
  .msg { margin-top: 12px; font-size: 14px; color: var(--muted); line-height: 1.5; }
  .msg.warn { color: #ffb86b; }
</style>
</head>
<body>
  <header>
    <h1>ECG Live</h1>
    <span id="status" class="pill">연결 안 됨</span>
  </header>

  <div class="hr">
    <span id="heart" class="heart">♥</span>
    <span id="bpm" class="bpm">--</span>
    <span class="unit">bpm</span>
  </div>

  <div class="scope"><canvas id="scope"></canvas></div>

  <div class="stats">
    <div class="stat"><div class="k">최근 RR 간격</div><div class="v" id="rr">-- ms</div></div>
    <div class="stat"><div class="k">측정 시간</div><div class="v" id="elapsed">0:00</div></div>
    <div class="stat"><div class="k">수신 샘플</div><div class="v" id="samples">0</div></div>
    <div class="stat"><div class="k">패킷 손실</div><div class="v" id="loss">0</div></div>
  </div>

  <button id="connect">기기 연결</button>
  <div id="msg" class="msg"></div>

<script>
// ECG 실시간 신호처리 (브라우저/Node 공용)
// - 필터: 0.5Hz 고역통과 + 40Hz 저역통과 + 60Hz 노치 (모두 2차 biquad, 실시간 처리 가능)
// - R-peak: 미분 -> 제곱 -> 150ms 이동평균 -> 적응형 임계값 + 불응기

class Biquad {
  constructor(type, f0, fs, Q = Math.SQRT1_2) {
    const w = 2 * Math.PI * f0 / fs, c = Math.cos(w), a = Math.sin(w) / (2 * Q);
    let b0, b1, b2;
    if (type === "lowpass") { b0 = (1 - c) / 2; b1 = 1 - c; b2 = (1 - c) / 2; }
    else if (type === "highpass") { b0 = (1 + c) / 2; b1 = -(1 + c); b2 = (1 + c) / 2; }
    else { b0 = 1; b1 = -2 * c; b2 = 1; }                       // notch
    const a0 = 1 + a;
    this.b = [b0 / a0, b1 / a0, b2 / a0];
    this.a = [-2 * c / a0, (1 - a) / a0];
    this.x1 = this.x2 = this.y1 = this.y2 = 0;
  }
  step(x) {
    const y = this.b[0] * x + this.b[1] * this.x1 + this.b[2] * this.x2
            - this.a[0] * this.y1 - this.a[1] * this.y2;
    this.x2 = this.x1; this.x1 = x; this.y2 = this.y1; this.y1 = y;
    return y;
  }
}

class EcgProcessor {
  constructor(fs = 250) {
    this.fs = fs;
    this.filters = [
      new Biquad("highpass", 0.5, fs),
      new Biquad("lowpass", 40, fs),
      new Biquad("notch", 60, fs, 30),
    ];
    this.n = 0;
    this.prev = 0;
    this.win = new Float32Array(Math.round(0.15 * fs));   // 150ms 이동평균 창
    this.winSum = 0; this.winI = 0;
    this.thr = 0;                                          // 적응형 임계값
    this.peakE = 0;                                        // 최근 에너지 최대치
    this.lastBeat = -1e9;
    this.searching = false; this.candI = 0; this.candV = -1e9;
    this.rr = [];                                          // 최근 RR 간격(ms)
    this.warmup = 2 * fs;                                  // 처음 2초는 필터 안정화
    this.hist = new Float32Array(fs);                      // 최근 1초 필터 출력 (R 위치 되짚기용)
  }

  // 원시 ADC 값 하나 입력 -> { y: 필터된 값, beat: R-peak 발생 시 {index, hr} }
  push(raw) {
    let y = raw;
    for (const f of this.filters) y = f.step(y);

    const d = y - this.prev; this.prev = y;
    const e2 = d * d;
    this.winSum += e2 - this.win[this.winI];
    this.win[this.winI] = e2; this.winI = (this.winI + 1) % this.win.length;
    const e = this.winSum / this.win.length;

    const i = this.n++;
    this.hist[i % this.hist.length] = y;
    let beat = null;
    if (i < this.warmup) { this.peakE = Math.max(this.peakE * 0.999, e); this.thr = 0.35 * this.peakE; return { y, beat }; }

    this.peakE = Math.max(this.peakE * (1 - 1 / (3 * this.fs)), e);   // 약 3초에 걸쳐 서서히 감소
    this.thr = 0.35 * this.peakE;

    const refractory = i - this.lastBeat < 0.3 * this.fs;             // 300ms 불응기 (최대 200bpm)
    if (!this.searching && e > this.thr && !refractory) {
      this.searching = true; this.candStart = i; this.candEnd = i + Math.round(0.12 * this.fs);
    }
    if (this.searching) {
      if (i >= this.candEnd) {
        this.searching = false;
        // 에너지는 이동평균이라 늦게 올라가므로, 임계값 통과 150ms 전부터 지금까지 중 가장 높은 지점 = R
        const from = Math.max(this.candStart - Math.round(0.15 * this.fs), this.lastBeat + 1, i - this.hist.length + 1);
        this.candI = from; this.candV = -Infinity;
        for (let k = from; k <= i; k++) { const v = this.hist[k % this.hist.length]; if (v > this.candV) { this.candV = v; this.candI = k; } }
        const rrMs = (this.candI - this.lastBeat) * 1000 / this.fs;
        this.lastBeat = this.candI;
        let hr = null;
        this.beatCount = (this.beatCount || 0) + 1;
        if (this.beatCount > 2 && rrMs > 300 && rrMs < 2000) {   // 처음 두 박동은 안정화용으로 버림
          this.rr.push(rrMs); if (this.rr.length > 8) this.rr.shift();
          const avg = this.rr.reduce((a, b) => a + b, 0) / this.rr.length;
          hr = 60000 / avg;
        }
        beat = { index: this.candI, rrMs, hr };
      }
    }
    return { y, beat };
  }
}

if (typeof module !== "undefined") module.exports = { Biquad, EcgProcessor };


// ---------- 설정 (피코 ecg_ble.py 와 동일해야 함) ----------
const SERVICE_UUID = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
const DATA_UUID    = "6e400003-b5a3-f393-e0a9-e50e24dcca9e";
const FS = 250;               // 샘플링 주파수
const WINDOW_SEC = 5;         // 화면에 보이는 시간

// ---------- 상태 ----------
const N = FS * WINDOW_SEC;
const trace = new Float32Array(N).fill(NaN);
const beats = new Uint8Array(N);
let pos = 0;
let proc = new EcgProcessor(FS);
let device = null, lastSeq = null, lost = 0, received = 0, startTime = 0;

const $ = (id) => document.getElementById(id);
const canvas = $("scope"), ctx = canvas.getContext("2d");

// ---------- BLE ----------
if (!navigator.bluetooth) {
  $("msg").className = "msg warn";
  $("msg").textContent = "이 브라우저는 블루투스를 지원하지 않아요. 아이폰은 Bluefy 앱에서, PC는 크롬에서 열어주세요.";
}

$("connect").onclick = async () => {
  if (device && device.gatt.connected) { device.gatt.disconnect(); return; }
  try {
    setStatus("검색 중…");
    device = await navigator.bluetooth.requestDevice({
      filters: [{ namePrefix: "ECG" }],
      optionalServices: [SERVICE_UUID],
    });
    device.addEventListener("gattserverdisconnected", onDisconnected);
    setStatus("연결 중…");
    const server = await device.gatt.connect();
    const service = await server.getPrimaryService(SERVICE_UUID);
    const ch = await service.getCharacteristic(DATA_UUID);
    ch.addEventListener("characteristicvaluechanged", onPacket);
    await ch.startNotifications();
    resetSession();
    setStatus("연결됨", true);
    $("connect").textContent = "연결 끊기";
    $("connect").className = "secondary";
    $("msg").textContent = "";
  } catch (e) {
    setStatus("연결 안 됨");
    $("msg").className = "msg warn";
    $("msg").textContent = "연결 실패: " + e.message;
  }
};

function onDisconnected() {
  setStatus("연결 안 됨");
  $("connect").textContent = "기기 연결";
  $("connect").className = "";
}

function resetSession() {
  proc = new EcgProcessor(FS);
  trace.fill(NaN); beats.fill(0); pos = 0;
  lastSeq = null; lost = 0; received = 0; startTime = performance.now();
  $("bpm").textContent = "--"; $("rr").textContent = "-- ms";
}

// 패킷: [seq uint16][sample uint16 x 9], 리틀엔디언
function onPacket(ev) {
  const dv = ev.target.value;
  const seq = dv.getUint16(0, true);
  if (lastSeq !== null) {
    const gap = (seq - lastSeq - 1) & 0xffff;
    if (gap > 0 && gap < 1000) lost += gap;
  }
  lastSeq = seq;

  for (let o = 2; o + 1 < dv.byteLength; o += 2) {
    const raw = dv.getUint16(o, true);
    const { y, beat } = proc.push(raw);
    trace[pos] = y; beats[pos] = 0;
    if (beat) {
      const back = (proc.n - 1) - beat.index;           // R-peak는 조금 전 샘플
      beats[(pos - back + N) % N] = 1;
      onBeat(beat);
    }
    pos = (pos + 1) % N;
    received++;
  }
}

function onBeat(beat) {
  const h = $("heart"); h.classList.add("pulse"); setTimeout(() => h.classList.remove("pulse"), 120);
  if (beat.hr) {
    $("bpm").textContent = Math.round(beat.hr);
    $("rr").textContent = Math.round(beat.rrMs) + " ms";
  }
}

function setStatus(text, on = false) {
  $("status").textContent = text;
  $("status").className = "pill" + (on ? " on" : "");
}

// ---------- 그리기 (스윕 방식: 모니터처럼 왼쪽→오른쪽으로 덮어씀) ----------
function resize() {
  const dpr = window.devicePixelRatio || 1;
  canvas.width = canvas.clientWidth * dpr;
  canvas.height = canvas.clientHeight * dpr;
}
window.addEventListener("resize", resize);
resize();

function draw() {
  const W = canvas.width, H = canvas.height, dpr = window.devicePixelRatio || 1;
  ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, H);

  // 격자: 큰 칸 = 0.2초 (심전도 용지와 동일)
  ctx.strokeStyle = "#0f2a1c"; ctx.lineWidth = 1;
  ctx.beginPath();
  for (let s = 0; s <= WINDOW_SEC; s += 0.2) { const x = Math.round(s / WINDOW_SEC * W) + 0.5; ctx.moveTo(x, 0); ctx.lineTo(x, H); }
  for (let k = 1; k < 6; k++) { const yy = Math.round(k * H / 6) + 0.5; ctx.moveTo(0, yy); ctx.lineTo(W, yy); }
  ctx.stroke();

  // 자동 스케일
  let mn = Infinity, mx = -Infinity;
  for (let i = 0; i < N; i++) { const v = trace[i]; if (v === v) { if (v < mn) mn = v; if (v > mx) mx = v; } }
  if (mx > mn) {
    const pad = (mx - mn) * 0.15, lo = mn - pad, hi = mx + pad;
    const yOf = (v) => H - (v - lo) / (hi - lo) * H;
    const gap = Math.round(0.08 * FS);                    // 현재 위치 앞의 빈 틈

    ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue("--trace");
    ctx.lineWidth = 2 * dpr; ctx.lineJoin = "round";
    ctx.beginPath();
    let pen = false;
    for (let i = 0; i < N; i++) {
      const ahead = (i - pos + N) % N;
      const v = trace[i];
      if (ahead < gap || v !== v) { pen = false; continue; }
      const x = i / (N - 1) * W, yy = yOf(v);
      if (pen) ctx.lineTo(x, yy); else { ctx.moveTo(x, yy); pen = true; }
    }
    ctx.stroke();

    // R-peak 표시
    ctx.fillStyle = "#ff5a6e";
    for (let i = 0; i < N; i++) {
      if (!beats[i] || (i - pos + N) % N < gap) continue;
      const x = i / (N - 1) * W, yy = yOf(trace[i]) - 10 * dpr;
      ctx.beginPath(); ctx.moveTo(x, yy); ctx.lineTo(x - 5 * dpr, yy - 8 * dpr); ctx.lineTo(x + 5 * dpr, yy - 8 * dpr); ctx.fill();
    }
  }

  // 통계
  if (device && device.gatt.connected) {
    const sec = Math.floor((performance.now() - startTime) / 1000);
    $("elapsed").textContent = Math.floor(sec / 60) + ":" + String(sec % 60).padStart(2, "0");
  }
  $("samples").textContent = received.toLocaleString();
  $("loss").textContent = lost;

  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);
</script>
</body>
</html>
